name: terse
description: Terse - A Journal in about 90 Seconds
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.1
  drift_flutter: ^0.3.1
  entries_repository:
    path: packages/entries_repository
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.4
  intl: ^0.20.2
  local_database:
    path: packages/local_database
  material_ui: ^1.1.1
  metrics_repository:
    path: packages/metrics_repository
  onboarding_repository:
    path: packages/onboarding_repository
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  shared_preferences_storage:
    path: packages/shared_preferences_storage

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.26
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/licenses/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
