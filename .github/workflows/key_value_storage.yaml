name: key_value_storage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "packages/key_value_storage/**"
      - ".github/workflows/key_value_storage.yaml"
    branches:
      - main
  pull_request:
    paths:
      - "packages/key_value_storage/**"
      - ".github/workflows/key_value_storage.yaml"
    branches:
      - main

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v2
    with:
      dart_sdk: stable
      working_directory: packages/key_value_storage
